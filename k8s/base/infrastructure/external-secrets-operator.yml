# External Secrets Operator Configuration (Recommended for Production)
#
# This file demonstrates how to use External Secrets Operator (ESO)
# to fetch secrets from external secret management systems at runtime.
#
# Installation:
# helm repo add external-secrets https://charts.external-secrets.io
# helm install external-secrets external-secrets/external-secrets -n external-secrets-system --create-namespace
#
# Supported backends:
# - AWS Secrets Manager
# - Google Secret Manager
# - Azure Key Vault
# - HashiCorp Vault
# - Kubernetes Secrets (for development)
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: stockxpress-secret-store
  namespace: stockxpress
spec:
  provider:
    # Example: AWS Secrets Manager
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: stockxpress-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mysql-order-external-secret
  namespace: stockxpress
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: stockxpress-secret-store
    kind: SecretStore
  target:
    name: mysql-order-secret
    creationPolicy: Owner
  data:
    - secretKey: root-password
      remoteRef:
        key: stockxpress/mysql-order/root-password
    - secretKey: username
      remoteRef:
        key: stockxpress/mysql-order/username
    - secretKey: password
      remoteRef:
        key: stockxpress/mysql-order/password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mysql-inventory-external-secret
  namespace: stockxpress
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: stockxpress-secret-store
    kind: SecretStore
  target:
    name: mysql-inventory-secret
    creationPolicy: Owner
  data:
    - secretKey: root-password
      remoteRef:
        key: stockxpress/mysql-inventory/root-password
    - secretKey: username
      remoteRef:
        key: stockxpress/mysql-inventory/username
    - secretKey: password
      remoteRef:
        key: stockxpress/mysql-inventory/password