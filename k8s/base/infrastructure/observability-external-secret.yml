# External Secret for Observability Basic Auth
# This references credentials stored in AWS Secrets Manager
# Requires External Secrets Operator to be installed in the cluster
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: observability-basic-auth
  namespace: stockxpress
  labels:
    app: stockxpress
    component: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: stockxpress-secret-store
    kind: ClusterSecretStore
  target:
    name: observability-basic-auth
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Create htpasswd format for nginx basic auth
        # The template will use username and password from AWS Secrets Manager
        auth: "{{ .username | htpasswd .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: stockxpress/observability/basic-auth
        property: username
    - secretKey: password
      remoteRef:
        key: stockxpress/observability/basic-auth
        property: password
