# WARNING: These are template secrets with base64 encoded default values
# In production, replace these with actual secrets and manage them securely
# DO NOT commit actual secrets to version control
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-order-secret
  namespace: stockxpress
  labels:
    app: mysql-order
    component: database
type: Opaque
data:
  # Default values (base64 encoded):
  # root-password: root (base64: cm9vdA==)
  # username: sesh (base64: c2VzaA==)
  # password: password (base64: cGFzc3dvcmQ=)
  root-password: cm9vdA==
  username: c2VzaA==
  password: cGFzc3dvcmQ=
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-inventory-secret
  namespace: stockxpress
  labels:
    app: mysql-inventory
    component: database
type: Opaque
data:
  # Default values (base64 encoded):
  # root-password: root (base64: cm9vdA==)
  # username: sesh (base64: c2VzaA==)
  # password: password (base64: cGFzc3dvcmQ=)
  root-password: cm9vdA==
  username: c2VzaA==
  password: cGFzc3dvcmQ=
