---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: stockxpress
  labels:
    app: order-service
    component: microservice
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        component: microservice
        tier: backend
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
              name: http
              protocol: TCP
          env:
            # Application Configuration
            - name: SPRING_APPLICATION_NAME
              value: "order-service"
            - name: SERVER_PORT
              value: "8083"
            
            # MySQL Database Configuration
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-order:3306/$(MYSQL_DATABASE)?useSSL=false&allowPublicKeyRetrieval=true"
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: mysql-order-config
                  key: database-name
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-order-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-order-secret
                  key: password
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: "com.mysql.cj.jdbc.Driver"
            
            # JPA/Hibernate Configuration
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: SPRING_JPA_SHOW_SQL
              value: "false"
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
              value: "org.hibernate.dialect.MySQL57Dialect"
            - name: SPRING_JPA_DATABASE
              value: "MYSQL"
            
            # Kafka Configuration
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: SPRING_KAFKA_TEMPLATE_DEFAULT_TOPIC
              value: "notificationTopic"
            - name: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
              value: "org.apache.kafka.common.serialization.StringSerializer"
            - name: SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER
              value: "org.springframework.kafka.support.serializer.JsonSerializer"
            - name: SPRING_KAFKA_PRODUCER_PROPERTIES_SPRING_JSON_TYPE_MAPPING
              value: "event:com.seshrao.stockxpress.orderservice.event.OrderPlacedEvent"
            
            # Cache Configuration
            - name: SPRING_CACHE_TYPE
              value: "caffeine"
            - name: SPRING_CACHE_CAFFEINE_SPEC
              value: "maximumSize=500,expireAfterWrite=10m,recordStats"
            
            # Eureka Client Configuration
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka:password@discovery-server:8761/eureka/"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS
              value: "5"
            - name: EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS
              value: "10"
            
            # Distributed Tracing (Zipkin)
            - name: SPRING_ZIPKIN_BASE_URL
              value: "http://zipkin:9411"
            - name: SPRING_SLEUTH_SAMPLER_PROBABILITY
              value: "1.0"
            
            # Resilience4j Circuit Breaker Configuration
            - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_INVENTORY_REGISTERHEALTHINDICATOR
              value: "true"
            - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_INVENTORY_SLIDINGWINDOWTYPE
              value: "COUNT_BASED"
            - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_INVENTORY_SLIDINGWINDOWSIZE
              value: "5"
            - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_INVENTORY_FAILURERATETHRESHOLD
              value: "50"
            - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_INVENTORY_WAITDURATIONINOPENSTATE
              value: "5s"
            - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_INVENTORY_PERMITTEDNUMBEROFCALLSINHALFOPENS TATE
              value: "3"
            - name: RESILIENCE4J_CIRCUITBREAKER_INSTANCES_INVENTORY_AUTOMATICTRANSITIONFROMOPENTOH ALFOPENENABLED
              value: "true"
            
            # Resilience4j Time Limiter Configuration
            - name: RESILIENCE4J_TIMELIMITER_INSTANCES_INVENTORY_TIMEOUT_DURATION
              value: "3s"
            - name: RESILIENCE4J_TIMELIMITER_INSTANCES_INVENTORY_CANCEL_RUNNING_FUTURE
              value: "true"
            
            # Resilience4j Retry Configuration
            - name: RESILIENCE4J_RETRY_INSTANCES_INVENTORY_MAX_ATTEMPTS
              value: "3"
            - name: RESILIENCE4J_RETRY_INSTANCES_INVENTORY_WAIT_DURATION
              value: "5s"
            - name: RESILIENCE4J_RETRY_INSTANCES_INVENTORY_ENABLE_EXPONENTIAL_BACKOFF
              value: "true"
            - name: RESILIENCE4J_RETRY_INSTANCES_INVENTORY_EXPONENTIAL_BACKOFF_MULTIPLIER
              value: "2"
            
            # Management/Actuator Configuration
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,metrics,prometheus,circuitbreakers,caches"
            - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
              value: "always"
            - name: MANAGEMENT_HEALTH_CIRCUITBREAKERS_ENABLED
              value: "true"
            - name: MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED
              value: "true"
            
            # Logging Configuration
            - name: LOGGING_LEVEL_ROOT
              value: "INFO"
            - name: LOGGING_LEVEL_COM_SESHRAO_STOCKXPRESS_ORDERSERVICE
              value: "INFO"
            - name: LOGGING_LEVEL_IO_GITHUB_RESILIENCE4J
              value: "INFO"
            
            # Order Service Specific Configuration
            - name: ORDER_CACHE_ENABLED
              value: "true"
            - name: ORDER_CACHE_TTL
              value: "600"
            - name: ORDER_CACHE_MAXSIZE
              value: "500"
            - name: ORDER_VALIDATION_MAXLINEITEMS
              value: "50"
            - name: ORDER_VALIDATION_MINQUANTITY
              value: "1"
            - name: ORDER_VALIDATION_MAXQUANTITY
              value: "1000"
          
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
      
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
