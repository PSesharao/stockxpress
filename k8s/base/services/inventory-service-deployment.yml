---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: stockxpress
  labels:
    app: inventory-service
    component: microservice
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
        component: microservice
        tier: backend
    spec:
      containers:
        - name: inventory-service
          image: inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
              name: http
              protocol: TCP
          env:
            # Application Configuration
            - name: SPRING_APPLICATION_NAME
              value: "inventory-service"
            - name: SERVER_PORT
              value: "8082"
            
            # MySQL Database Configuration
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-inventory:3306/$(MYSQL_DATABASE)?useSSL=false&allowPublicKeyRetrieval=true"
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: mysql-inventory-config
                  key: database-name
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-inventory-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-inventory-secret
                  key: password
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: "com.mysql.cj.jdbc.Driver"
            
            # JPA/Hibernate Configuration
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: SPRING_JPA_SHOW_SQL
              value: "false"
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
              value: "org.hibernate.dialect.MySQL57Dialect"
            - name: SPRING_JPA_DATABASE
              value: "MYSQL"
            
            # Redis Cache Configuration
            - name: SPRING_REDIS_HOST
              value: "redis"
            - name: SPRING_REDIS_PORT
              value: "6379"
            - name: SPRING_REDIS_TIMEOUT
              value: "60000"
            - name: SPRING_CACHE_TYPE
              value: "redis"
            - name: SPRING_CACHE_REDIS_TIME_TO_LIVE
              value: "10000"
            - name: SPRING_CACHE_REDIS_USE_KEY_PREFIX
              value: "true"
            - name: SPRING_CACHE_REDIS_KEY_PREFIX
              value: "inventory:"
            
            # Eureka Client Configuration
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka:password@discovery-server:8761/eureka/"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS
              value: "5"
            - name: EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS
              value: "10"
            
            # Distributed Tracing (Zipkin)
            - name: SPRING_ZIPKIN_BASE_URL
              value: "http://zipkin:9411"
            - name: SPRING_SLEUTH_SAMPLER_PROBABILITY
              value: "1.0"
            
            # Management/Actuator Configuration
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,metrics,prometheus,caches"
            - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
              value: "always"
            - name: MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED
              value: "true"
            
            # Logging Configuration
            - name: LOGGING_LEVEL_ROOT
              value: "INFO"
            - name: LOGGING_LEVEL_COM_SESHRAO_STOCKXPRESS_INVENTORYSERVICE
              value: "INFO"
            
            # Inventory Service Specific Configuration
            - name: INVENTORY_CACHE_ENABLED
              value: "true"
            - name: INVENTORY_CACHE_TTL
              value: "10"
            - name: INVENTORY_CACHE_MAXSIZE
              value: "1000"
            - name: INVENTORY_VALIDATION_MINQUANTITY
              value: "0"
            - name: INVENTORY_VALIDATION_MAXQUANTITY
              value: "10000"
          
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
      
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
