# Application
spring.application.name=inventory-service
# Database Configuration
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_service?useSSL=false
spring.datasource.username=root
spring.datasource.password=949195
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect
spring.jpa.database=MYSQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
# should not use this in production
# Server Configuration
server.port=0
#server.port=8082
#The application will bind to the any available dynamically assigned port
# Eureka Configuration
eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka/
# Distributed Tracing
spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0
# Redis Cache Configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=60000
spring.cache.type=redis
spring.cache.redis.time-to-live=10000
# Cache TTL set to 10 seconds (10000ms) for inventory checks
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=inventory:
# Logging Configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.seshrao.stockxpress.inventoryservice=INFO
logging.level.org.springframework.cache=DEBUG