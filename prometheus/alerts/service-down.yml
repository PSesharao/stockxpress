# Service Availability Alert Rules

groups:
  - name: service_availability
    interval: 30s
    rules:
      # Service Down Alert
      - alert: ServiceDown
        expr: up{job=~".*-service|discovery-server|api-gateway"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Service {{ $labels.service }} is down"
          description: "Service {{ $labels.service }} ({{ $labels.job }}) has been unreachable for more than 2 minutes"
          dashboard: "http://grafana:3000/d/microservices/service-dashboard?var-service={{ $labels.service }}"

      # Service Unavailable (Health Check)
      - alert: ServiceUnhealthy
        expr: |
          spring_boot_application_ready_status{job=~".*-service|discovery-server|api-gateway"} == 0
        for: 3m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Service {{ $labels.service }} is unhealthy"
          description: "Service {{ $labels.service }} health check is failing for more than 3 minutes"
          dashboard: "http://grafana:3000/d/microservices/service-dashboard?var-service={{ $labels.service }}"

      # Multiple Service Instances Down
      - alert: MultipleServiceInstancesDown
        expr: |
          count(up{job=~".*-service"} == 0) by (job) > 1
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Multiple instances of {{ $labels.job }} are down"
          description: "{{ $value }} instances of {{ $labels.job }} are currently down"
          dashboard: "http://grafana:3000/d/microservices/overview-dashboard"

      # Discovery Server Down
      - alert: DiscoveryServerDown
        expr: up{job="discovery-server"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
          service: discovery-server
        annotations:
          summary: "Discovery Server (Eureka) is down"
          description: "Discovery Server is unreachable - service discovery may be impacted"
          dashboard: "http://grafana:3000/d/eureka/discovery-server-dashboard"

      # API Gateway Down
      - alert: APIGatewayDown
        expr: up{job="api-gateway"} == 0
        for: 1m
        labels:
          severity: critical
          category: availability
          service: api-gateway
        annotations:
          summary: "API Gateway is down"
          description: "API Gateway is unreachable - all external requests are blocked"
          dashboard: "http://grafana:3000/d/api-gateway/api-gateway-dashboard"

      # High Request Failure Rate
      - alert: HighRequestFailureRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (service, job)
            /
            sum(rate(http_server_requests_seconds_count[5m])) by (service, job)
          ) * 100 > 50
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Service {{ $labels.service }} has very high failure rate"
          description: "Service {{ $labels.service }} is experiencing {{ $value | humanize }}% request failure rate - service may be degraded"
          dashboard: "http://grafana:3000/d/microservices/service-dashboard?var-service={{ $labels.service }}"

      # No Traffic Alert (Potential Issue)
      - alert: ServiceNoTraffic
        expr: |
          rate(http_server_requests_seconds_count[10m]) == 0
          and
          up{job=~".*-service|api-gateway"} == 1
        for: 10m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "Service {{ $labels.service }} is receiving no traffic"
          description: "Service {{ $labels.service }} is up but has received no requests for 10 minutes"
          dashboard: "http://grafana:3000/d/microservices/service-dashboard?var-service={{ $labels.service }}"

      # Circuit Breaker Open
      - alert: CircuitBreakerOpen
        expr: |
          resilience4j_circuitbreaker_state{state="open"} == 1
        for: 5m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "Circuit breaker open on {{ $labels.service }}"
          description: "Circuit breaker {{ $labels.name }} is open on {{ $labels.service }} - requests are being blocked"
          dashboard: "http://grafana:3000/d/microservices/service-dashboard?var-service={{ $labels.service }}"

      # Too Many Service Restarts
      - alert: FrequentServiceRestarts
        expr: |
          changes(process_start_time_seconds[15m]) > 3
        for: 1m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "Service {{ $labels.service }} restarting frequently"
          description: "Service {{ $labels.service }} has restarted {{ $value }} times in the last 15 minutes"
          dashboard: "http://grafana:3000/d/microservices/service-dashboard?var-service={{ $labels.service }}"
