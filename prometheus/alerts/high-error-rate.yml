# High Error Rate Alert Rules

groups:
  - name: high_error_rate
    interval: 30s
    rules:
      # HTTP 5xx Error Rate Alert
      - alert: HighHTTP5xxErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (service, job)
            /
            sum(rate(http_server_requests_seconds_count[5m])) by (service, job)
          ) * 100 > 5
        for: 5m
        labels:
          severity: critical
          category: error_rate
        annotations:
          summary: "High 5xx error rate on {{ $labels.service }}"
          description: "Service {{ $labels.service }} is experiencing {{ $value | humanize }}% 5xx error rate (threshold: 5%)"
          dashboard: "http://grafana:3000/d/microservices/service-dashboard?var-service={{ $labels.service }}"

      # HTTP 4xx Error Rate Alert
      - alert: HighHTTP4xxErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"4..",status!="404"}[5m])) by (service, job)
            /
            sum(rate(http_server_requests_seconds_count[5m])) by (service, job)
          ) * 100 > 10
        for: 10m
        labels:
          severity: warning
          category: error_rate
        annotations:
          summary: "High 4xx error rate on {{ $labels.service }}"
          description: "Service {{ $labels.service }} is experiencing {{ $value | humanize }}% 4xx error rate (threshold: 10%)"
          dashboard: "http://grafana:3000/d/microservices/service-dashboard?var-service={{ $labels.service }}"

      # General Application Error Rate
      - alert: HighApplicationErrorRate
        expr: |
          (
            sum(rate(application_errors_total[5m])) by (service, job)
            /
            sum(rate(application_requests_total[5m])) by (service, job)
          ) * 100 > 5
        for: 5m
        labels:
          severity: critical
          category: error_rate
        annotations:
          summary: "High application error rate on {{ $labels.service }}"
          description: "Service {{ $labels.service }} has {{ $value | humanize }}% application error rate (threshold: 5%)"
          dashboard: "http://grafana:3000/d/microservices/service-dashboard?var-service={{ $labels.service }}"

      # Exception Rate Alert
      - alert: HighExceptionRate
        expr: |
          sum(rate(application_exceptions_total[5m])) by (service, job, exception) > 1
        for: 5m
        labels:
          severity: warning
          category: error_rate
        annotations:
          summary: "High exception rate on {{ $labels.service }}"
          description: "Service {{ $labels.service }} is throwing {{ $labels.exception }} at {{ $value | humanize }} exceptions/sec"
          dashboard: "http://grafana:3000/d/microservices/service-dashboard?var-service={{ $labels.service }}"

      # API Gateway Error Rate
      - alert: APIGatewayHighErrorRate
        expr: |
          (
            sum(rate(spring_cloud_gateway_requests_seconds_count{outcome="SERVER_ERROR"}[5m])) by (service)
            /
            sum(rate(spring_cloud_gateway_requests_seconds_count[5m])) by (service)
          ) * 100 > 5
        for: 3m
        labels:
          severity: critical
          category: error_rate
          service: api-gateway
        annotations:
          summary: "API Gateway experiencing high error rate"
          description: "API Gateway has {{ $value | humanize }}% error rate (threshold: 5%)"
          dashboard: "http://grafana:3000/d/api-gateway/api-gateway-dashboard"
