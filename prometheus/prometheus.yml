# Prometheus Configuration for Microservices Monitoring

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: 'microservices-cluster'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load alert rules
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          tier: 'monitoring'

  # Discovery Server (Eureka)
  - job_name: 'discovery-server'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['discovery-server:8761']
        labels:
          service: 'discovery-server'
          tier: 'infrastructure'
          application: 'eureka'
          environment: 'production'

  # API Gateway
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['api-gateway:8080']
        labels:
          service: 'api-gateway'
          tier: 'gateway'
          application: 'spring-cloud-gateway'
          environment: 'production'

  # Product Service
  - job_name: 'product-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['product-service:8081']
        labels:
          service: 'product-service'
          tier: 'application'
          domain: 'product'
          environment: 'production'

  # Inventory Service
  - job_name: 'inventory-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['inventory-service:8082']
        labels:
          service: 'inventory-service'
          tier: 'application'
          domain: 'inventory'
          environment: 'production'

  # Order Service
  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['order-service:8083']
        labels:
          service: 'order-service'
          tier: 'application'
          domain: 'order'
          environment: 'production'

  # Notification Service
  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['notification-service:8084']
        labels:
          service: 'notification-service'
          tier: 'application'
          domain: 'notification'
          environment: 'production'

  # Optional: Kafka Exporter (if using kafka-exporter)
  - job_name: 'kafka-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          service: 'kafka'
          tier: 'messaging'
          environment: 'production'

  # Optional: Node Exporter for host metrics
  - job_name: 'node-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          tier: 'monitoring'
          environment: 'production'
