name: CD - Deploy

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip smoke tests'
        required: false
        type: boolean
        default: false

env:
  DOCKER_REGISTRY: docker.io
  KUBECTL_VERSION: 'v1.28.0'

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment:
      name: staging
      url: https://staging.stockxpress.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Configure kubectl for staging
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Set Docker image tags
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IMAGE_TAG="${{ github.sha }}"
          else
            IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update Kubernetes manifests
        run: |
          # Update image tags in Kubernetes manifests
          cd k8s/overlays/dev
          
          # Create kustomization.yaml if it doesn't exist
          cat > kustomization.yaml <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          
          namespace: stockxpress-staging
          
          resources:
            - ../../base/infrastructure
            - ../../base/services
          
          images:
            - name: seshrao/product-service
              newTag: ${{ env.IMAGE_TAG }}
            - name: seshrao/order-service
              newTag: ${{ env.IMAGE_TAG }}
            - name: seshrao/inventory-service
              newTag: ${{ env.IMAGE_TAG }}
            - name: seshrao/discovery-server
              newTag: ${{ env.IMAGE_TAG }}
            - name: seshrao/api-gateway
              newTag: ${{ env.IMAGE_TAG }}
            - name: seshrao/notification-service
              newTag: ${{ env.IMAGE_TAG }}
          
          configMapGenerator:
            - name: app-config
              literals:
                - ENVIRONMENT=staging
                - LOG_LEVEL=INFO
          EOF

      - name: Deploy infrastructure to staging
        run: |
          echo "🚀 Deploying infrastructure components..."
          kubectl apply -k k8s/overlays/dev
          
          # Wait for infrastructure to be ready
          kubectl wait --for=condition=ready pod -l app=mysql-inventory -n stockxpress-staging --timeout=300s || true
          kubectl wait --for=condition=ready pod -l app=mysql-order -n stockxpress-staging --timeout=300s || true
          kubectl wait --for=condition=ready pod -l app=mongodb -n stockxpress-staging --timeout=300s || true
          kubectl wait --for=condition=ready pod -l app=kafka -n stockxpress-staging --timeout=300s || true
          kubectl wait --for=condition=ready pod -l app=redis -n stockxpress-staging --timeout=300s || true

      - name: Deploy services to staging
        run: |
          echo "🚀 Deploying microservices..."
          
          # Deploy in order: discovery-server -> services -> api-gateway
          kubectl set image deployment/discovery-server discovery-server=${{ secrets.DOCKER_USERNAME }}/discovery-server:${{ env.IMAGE_TAG }} -n stockxpress-staging
          kubectl rollout status deployment/discovery-server -n stockxpress-staging --timeout=300s
          
          # Deploy core services
          for service in product-service inventory-service order-service notification-service; do
            echo "Deploying $service..."
            kubectl set image deployment/$service $service=${{ secrets.DOCKER_USERNAME }}/$service:${{ env.IMAGE_TAG }} -n stockxpress-staging
          done
          
          # Wait for services to be ready
          for service in product-service inventory-service order-service notification-service; do
            kubectl rollout status deployment/$service -n stockxpress-staging --timeout=300s
          done
          
          # Deploy API Gateway last
          kubectl set image deployment/api-gateway api-gateway=${{ secrets.DOCKER_USERNAME }}/api-gateway:${{ env.IMAGE_TAG }} -n stockxpress-staging
          kubectl rollout status deployment/api-gateway -n stockxpress-staging --timeout=300s

      - name: Verify deployment
        run: |
          echo "✅ Verifying deployment..."
          kubectl get pods -n stockxpress-staging
          kubectl get services -n stockxpress-staging
          kubectl get deployments -n stockxpress-staging

      - name: Create deployment summary
        run: |
          echo "## 🎯 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Staging" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Services" >> $GITHUB_STEP_SUMMARY
          kubectl get deployments -n stockxpress-staging -o custom-columns=NAME:.metadata.name,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas,IMAGE:.spec.template.spec.containers[0].image >> $GITHUB_STEP_SUMMARY

  smoke-tests:
    name: Run Smoke Tests
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for services to stabilize
        run: sleep 60

      - name: Test Discovery Server
        run: |
          echo "Testing Eureka Discovery Server..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://staging.stockxpress.com/eureka/apps)
          if [ $response -eq 200 ]; then
            echo "✅ Discovery Server is healthy"
          else
            echo "❌ Discovery Server health check failed with status: $response"
            exit 1
          fi

      - name: Test API Gateway
        run: |
          echo "Testing API Gateway..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://staging.stockxpress.com/actuator/health)
          if [ $response -eq 200 ]; then
            echo "✅ API Gateway is healthy"
          else
            echo "❌ API Gateway health check failed with status: $response"
            exit 1
          fi

      - name: Test Product Service
        run: |
          echo "Testing Product Service..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://staging.stockxpress.com/api/product/health)
          if [ $response -eq 200 ]; then
            echo "✅ Product Service is healthy"
          else
            echo "❌ Product Service health check failed with status: $response"
            exit 1
          fi

      - name: Test Order Service
        run: |
          echo "Testing Order Service..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://staging.stockxpress.com/api/order/health)
          if [ $response -eq 200 ]; then
            echo "✅ Order Service is healthy"
          else
            echo "❌ Order Service health check failed with status: $response"
            exit 1
          fi

      - name: Test Inventory Service
        run: |
          echo "Testing Inventory Service..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://staging.stockxpress.com/api/inventory/health)
          if [ $response -eq 200 ]; then
            echo "✅ Inventory Service is healthy"
          else
            echo "❌ Inventory Service health check failed with status: $response"
            exit 1
          fi

      - name: End-to-end order flow test
        run: |
          echo "Testing end-to-end order flow..."
          
          # Get access token from Keycloak
          TOKEN=$(curl -s -X POST "https://staging.stockxpress.com/realms/stockxpress/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${{ secrets.KEYCLOAK_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.KEYCLOAK_CLIENT_SECRET }}" \
            -d "grant_type=client_credentials" | jq -r '.access_token')
          
          # Create a test product
          PRODUCT_ID=$(curl -s -X POST "https://staging.stockxpress.com/api/product" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"Test Product","description":"E2E Test","price":99.99}' | jq -r '.id')
          
          echo "Created product: $PRODUCT_ID"
          
          # Place an order
          ORDER_RESPONSE=$(curl -s -X POST "https://staging.stockxpress.com/api/order" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"orderLineItemDtoList":[{"skuCode":"'$PRODUCT_ID'","price":99.99,"quantity":1}]}')
          
          echo "Order response: $ORDER_RESPONSE"
          
          if echo "$ORDER_RESPONSE" | jq -e '.orderNumber' > /dev/null; then
            echo "✅ End-to-end order flow test passed"
          else
            echo "❌ End-to-end order flow test failed"
            exit 1
          fi

      - name: Generate smoke test report
        if: always()
        run: |
          echo "## 🧪 Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Discovery Server | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| API Gateway | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Product Service | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Order Service | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Inventory Service | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Order Flow | ✅ Passed |" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Deploy to Production
    needs: smoke-tests
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') ||
      (github.event_name == 'workflow_run' && needs.smoke-tests.result == 'success')
    environment:
      name: production
      url: https://stockxpress.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Configure kubectl for production
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Set Docker image tags
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IMAGE_TAG="${{ github.sha }}"
          else
            IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Create backup of current deployment
        run: |
          echo "📦 Creating backup of current deployment..."
          kubectl get deployments -n stockxpress-production -o yaml > production-backup-$(date +%Y%m%d-%H%M%S).yaml

      - name: Update Kubernetes manifests
        run: |
          cd k8s/overlays/prod
          
          cat > kustomization.yaml <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          
          namespace: stockxpress-production
          
          resources:
            - ../../base/infrastructure
            - ../../base/services
          
          images:
            - name: seshrao/product-service
              newTag: ${{ env.IMAGE_TAG }}
            - name: seshrao/order-service
              newTag: ${{ env.IMAGE_TAG }}
            - name: seshrao/inventory-service
              newTag: ${{ env.IMAGE_TAG }}
            - name: seshrao/discovery-server
              newTag: ${{ env.IMAGE_TAG }}
            - name: seshrao/api-gateway
              newTag: ${{ env.IMAGE_TAG }}
            - name: seshrao/notification-service
              newTag: ${{ env.IMAGE_TAG }}
          
          replicas:
            - name: product-service
              count: 3
            - name: order-service
              count: 3
            - name: inventory-service
              count: 3
            - name: api-gateway
              count: 2
          
          configMapGenerator:
            - name: app-config
              literals:
                - ENVIRONMENT=production
                - LOG_LEVEL=WARN
          EOF

      - name: Deploy to production with blue-green strategy
        run: |
          echo "🚀 Deploying to production..."
          
          # Deploy discovery server first
          kubectl set image deployment/discovery-server discovery-server=${{ secrets.DOCKER_USERNAME }}/discovery-server:${{ env.IMAGE_TAG }} -n stockxpress-production
          kubectl rollout status deployment/discovery-server -n stockxpress-production --timeout=600s
          
          # Deploy services one by one with canary approach
          for service in product-service inventory-service order-service notification-service api-gateway; do
            echo "Deploying $service..."
            kubectl set image deployment/$service $service=${{ secrets.DOCKER_USERNAME }}/$service:${{ env.IMAGE_TAG }} -n stockxpress-production
            kubectl rollout status deployment/$service -n stockxpress-production --timeout=600s
            
            # Wait between deployments
            sleep 30
          done

      - name: Verify production deployment
        run: |
          echo "✅ Verifying production deployment..."
          kubectl get pods -n stockxpress-production
          kubectl get services -n stockxpress-production
          
          # Check all pods are running
          NOT_RUNNING=$(kubectl get pods -n stockxpress-production --field-selector=status.phase!=Running --no-headers | wc -l)
          if [ $NOT_RUNNING -gt 0 ]; then
            echo "❌ Some pods are not running!"
            kubectl get pods -n stockxpress-production
            exit 1
          fi
          
          echo "✅ All pods are running successfully!"

      - name: Run production smoke tests
        run: |
          echo "🧪 Running production smoke tests..."
          sleep 60  # Wait for services to stabilize
          
          # Test critical endpoints
          curl -f https://stockxpress.com/actuator/health || exit 1
          curl -f https://stockxpress.com/eureka/apps || exit 1
          
          echo "✅ Production smoke tests passed!"

      - name: Create production deployment summary
        run: |
          echo "## 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** ${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Services" >> $GITHUB_STEP_SUMMARY
          kubectl get deployments -n stockxpress-production -o custom-columns=NAME:.metadata.name,REPLICAS:.spec.replicas,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas,IMAGE:.spec.template.spec.containers[0].image >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Production deployment completed successfully!"
          echo "🎉 StockXpress is now live with version ${{ env.IMAGE_TAG }}!"

  rollback:
    name: Rollback on Failure
    needs: deploy-production
    runs-on: ubuntu-latest
    if: failure()
    environment:
      name: production
    
    steps:
      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Rollback deployments
        run: |
          echo "⚠️ Rolling back production deployment..."
          
          for service in discovery-server product-service inventory-service order-service notification-service api-gateway; do
            echo "Rolling back $service..."
            kubectl rollout undo deployment/$service -n stockxpress-production
            kubectl rollout status deployment/$service -n stockxpress-production --timeout=300s
          done
          
          echo "✅ Rollback completed successfully!"

      - name: Notify rollback
        run: |
          echo "## ⚠️ Production Rollback Executed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Production deployment failed and has been rolled back to the previous version." >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs and fix the issues before attempting another deployment." >> $GITHUB_STEP_SUMMARY